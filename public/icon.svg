<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Tech Cyan-Blue Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Accent Emerald Gradient for Overtime & Growth -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Golden Overtime Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Drop Shadows and Glows -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon Squircle (Standard iOS/Android rounded rect) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Tech Border Ring with Gradient Accent -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#brandGrad)" stroke-width="4" opacity="0.45"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>

  <!-- Subtle Circular Orbit / Precision Clock Grid -->
  <g transform="translate(256, 215)" filter="url(#dropShadow)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="148" fill="#131c31" stroke="url(#brandGrad)" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="136" fill="#090f1e" />
    <circle cx="0" cy="0" r="126" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Clock & Overtime Tick Marks -->
    <circle cx="0" cy="-114" r="4.5" fill="#38bdf8" />
    <circle cx="114" cy="0" r="4.5" fill="#38bdf8" />
    <circle cx="0" cy="114" r="4.5" fill="#38bdf8" />
    <circle cx="-114" cy="0" r="4.5" fill="#38bdf8" />

    <!-- 1.5x Overtime Active Arc Indicator -->
    <path d="M 0 -114 A 114 114 0 0 1 114 0" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Modern Stylized "Z" Monogram of ZeroSoft -->
    <!-- Top Horizontal Bar -->
    <path d="M -68 -62 L 58 -62 C 65 -62 70 -56 68 -49 L 58 -32 C 56 -28 51 -25 46 -25 L -26 -25 L 56 46 C 63 52 62 62 54 64 L -58 64 C -65 64 -70 58 -68 51 L -58 34 C -56 30 -51 27 -46 27 L 26 27 L -56 -44 C -63 -50 -62 -60 -54 -62 Z" 
          fill="url(#brandGrad)" 
          filter="url(#coreGlow)"/>

    <!-- Inner Core Tech Node -->
    <circle cx="0" cy="0" r="12" fill="#38bdf8" stroke="#090f1e" stroke-width="4"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>

    <!-- 1.5x Efficiency Badge -->
    <g transform="translate(42, 60)">
      <rect x="-32" y="-14" width="64" height="28" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1.5×</text>
    </g>
  </g>

  <!-- ZEROSOFT Wordmark Brand Text -->
  <text x="256" y="420" font-family="'Cairo', 'JetBrains Mono', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="5" text-anchor="middle">
    ZERO<tspan fill="#22d3ee">SOFT</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="256" y="452" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="3" text-anchor="middle">
    HR &amp; OVERTIME SYSTEM
  </text>
</svg>
